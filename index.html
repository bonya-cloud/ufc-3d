<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>UFC 3D — Пиксельный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050505; font-family:'Press Start 2P', monospace; }
  #canvasHolder { position:fixed; inset:0; cursor:grab; }
  #canvasHolder.dragging { cursor:grabbing; }
  #canvasHolder canvas { width:100% !important; height:100% !important; image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; color:#fff; }

  .hud-top { position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:0 14px; }
  .fighter-box { width:40%; }
  .fighter-box.right { text-align:right; }
  .fname { font-size:9px; letter-spacing:1px; text-shadow:2px 2px 0 #000; }
  .barOuter { height:14px; background:#1a1a1a; border:2px solid #444; margin-top:6px; box-shadow:0 0 0 1px #000 inset; }
  .barInner { height:100%; }
  .barInner.hp-left { background:linear-gradient(90deg,#ff3b30,#ff8a3d); }
  .barInner.hp-right { background:linear-gradient(90deg,#3d8bff,#3bd6ff); float:right; }
  .stamOuter { height:6px; background:#1a1a1a; border:1px solid #333; margin-top:4px; }
  .stamInner { height:100%; background:#ffd23b; }
  .stamInner.right { float:right; }

  .clock { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#111; border:3px solid #555; padding:6px 14px; font-size:16px; }
  .roundtag { position:absolute; top:56px; left:50%; transform:translateX(-50%); font-size:8px; letter-spacing:2px; opacity:.7; }

  .msg { position:absolute; top:92px; left:50%; transform:translateX(-50%); font-size:14px; letter-spacing:1px; text-shadow:2px 2px 0 #000; opacity:0; transition:opacity .15s; color:#ffcf3f;}
  .msg.show{opacity:1;}

  .controls { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:8px; opacity:.7; line-height:1.8; }
  .controls b { color:#ffcf3f; }

  #overlayEnd, #startScreen { position:fixed; inset:0; background:rgba(0,0,0,.86); display:none; align-items:center; justify-content:center; flex-direction:column; pointer-events:all; z-index:20;}
  #overlayEnd h1, #startScreen h1 { font-size:32px; margin:0; color:#ffcf3f; text-shadow:3px 3px 0 #000; letter-spacing:2px;}
  #overlayEnd p { color:#ccc; margin-top:14px; font-size:11px;}
  #overlayEnd button { margin-top:24px; padding:14px 26px; font-size:11px; font-family:'Press Start 2P', monospace; background:#ff3b30; color:#fff; border:3px solid #fff; cursor:pointer; }
  #overlayEnd button:hover{ background:#ff5a4f; }

  #startScreen { display:flex; z-index:25; }
  #startScreen .sub { color:#888; font-size:9px; margin-top:10px; letter-spacing:1px; }
  #startScreen .blink { margin-top:36px; color:#ffcf3f; font-size:11px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #loading { position:fixed; inset:0; background:#050505; color:#888; display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:2px; z-index:30;}
</style>
</head>
<body>

<div id="loading">ЗАГРУЗКА АРЕНЫ…</div>
<div id="canvasHolder"></div>

<div id="ui">
  <div class="hud-top">
    <div class="fighter-box left">
      <div class="fname">ВЫ — RED CORNER</div>
      <div class="barOuter"><div class="barInner hp-left" id="hpP1" style="width:100%"></div></div>
      <div class="stamOuter"><div class="stamInner" id="stP1" style="width:100%"></div></div>
    </div>
    <div class="fighter-box right">
      <div class="fname">CPU — BLUE CORNER</div>
      <div class="barOuter"><div class="barInner hp-right" id="hpP2" style="width:100%"></div></div>
      <div class="stamOuter"><div class="stamInner right" id="stP2" style="width:100%"></div></div>
    </div>
  </div>
  <div class="clock" id="clock">60</div>
  <div class="roundtag">РАУНД 1</div>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <b>WASD</b> движение &nbsp;|&nbsp; <b>J</b> джеб &nbsp;|&nbsp; <b>K</b> удар ногой &nbsp;|&nbsp; <b>L</b> блок<br>
    <b>мышь</b> (зажать+вести) — камера &nbsp;|&nbsp; <b>колесо</b> — зум
  </div>
</div>

<div id="startScreen">
  <h1>UFC 3D</h1>
  <div class="sub">PIXEL PROTOTYPE — 2 FIGHTERS</div>
  <div class="blink">НАЖМИ / ТАПНИ, ЧТОБЫ НАЧАТЬ БОЙ</div>
</div>

<div id="overlayEnd">
  <h1>K.O.!</h1>
  <p id="endSub">Красный угол побеждает</p>
  <button onclick="location.reload()">ЕЩЁ БОЙ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('load', init);

let scene, camera, renderer, clock;
let player, cpu, referee;
let gameOver = false, started = false;
let roundTime = 60;
const ARENA_R = 6.2;
const VIRTUAL_HEIGHT = 300; // internal pixel-render height -> chunky pixels
let TOON_GRADIENT;

// layout-independent keys (fixes RU keyboard layout bug: e.key gave cyrillic letters)
const KEYS = {};
document.addEventListener('keydown', e => { KEYS[e.code] = true; });
document.addEventListener('keyup', e => { KEYS[e.code] = false; });

let camYaw = 0, camPitch = 0.4, camDistance = 3.6;
let isDragging = false, lastX = 0, lastY = 0;

function init(){
  document.getElementById('loading').style.display='none';

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.Fog(0x0a0a0f, 16, 40);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 4, 9);

  renderer = new THREE.WebGLRenderer({antialias:false});
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  const holder = document.getElementById('canvasHolder');
  holder.appendChild(renderer.domElement);
  onResize();

  clock = new THREE.Clock();
  TOON_GRADIENT = makeToonGradient();

  buildArena();
  buildCrowd();
  referee = createReferee();
  scene.add(referee.group);

  player = createFighter(0xd6432f, 0x1a1a1a, true);
  cpu = createFighter(0x2f6fd6, 0x1a1a1a, false);
  player.group.position.set(-2, 0, 0);
  cpu.group.position.set(2, 0, 0);
  scene.add(player.group, cpu.group);

  setupCameraControls(holder);
  setupStartScreen();
  window.addEventListener('resize', onResize);
  animate();
}

function setupStartScreen(){
  const begin = ()=>{
    if (started) return;
    started = true;
    document.getElementById('startScreen').style.display = 'none';
  };
  document.getElementById('startScreen').addEventListener('click', begin);
  window.addEventListener('keydown', begin, {once:true});
}

function onResize(){
  const scale = window.innerHeight / VIRTUAL_HEIGHT;
  const w = Math.max(1, Math.floor(window.innerWidth/scale));
  const h = VIRTUAL_HEIGHT;
  renderer.setSize(w, h, false);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
}

/* ---------------- CAMERA CONTROLS ---------------- */
function setupCameraControls(holder){
  holder.addEventListener('contextmenu', e => e.preventDefault());
  holder.addEventListener('mousedown', e=>{
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
    holder.classList.add('dragging');
  });
  window.addEventListener('mouseup', ()=>{ isDragging = false; holder.classList.remove('dragging'); });
  window.addEventListener('mousemove', e=>{
    if(!isDragging) return;
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    lastX = e.clientX; lastY = e.clientY;
    camYaw -= dx*0.006;
    camPitch = Math.max(0.08, Math.min(1.15, camPitch + dy*0.004));
  });
  holder.addEventListener('wheel', e=>{
    camDistance = Math.max(2.0, Math.min(8.0, camDistance + e.deltaY*0.0025));
    e.preventDefault();
  }, {passive:false});

  holder.addEventListener('touchstart', e=>{
    if(e.touches.length===1){ isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
  }, {passive:true});
  holder.addEventListener('touchmove', e=>{
    if(!isDragging || e.touches.length!==1) return;
    const dx = e.touches[0].clientX-lastX, dy = e.touches[0].clientY-lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    camYaw -= dx*0.006;
    camPitch = Math.max(0.08, Math.min(1.15, camPitch + dy*0.004));
  }, {passive:true});
  holder.addEventListener('touchend', ()=>{ isDragging=false; });
}

/* ---------------- PIXEL / TOON HELPERS ---------------- */
function makeToonGradient(){
  const canvas=document.createElement('canvas'); canvas.width=4; canvas.height=1;
  const ctx=canvas.getContext('2d');
  const shades=['#3a3a3a','#7a7a7a','#b8b8b8','#ffffff'];
  shades.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(i,0,1,1); });
  const tex=new THREE.CanvasTexture(canvas);
  tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter;
  return tex;
}

function makeFloorTexture(){
  const size=1024;
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#e9e6df';
  ctx.fillRect(0,0,size,size);
  const cx=size/2, cy=size/2, radius=size*0.47;

  function wedge(angle,color){
    ctx.fillStyle=color;
    ctx.globalAlpha=0.32;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy, radius, angle-0.55, angle+0.55);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;
  }
  wedge(Math.PI, '#d6432f');
  wedge(0, '#2f6fd6');

  ctx.strokeStyle='#333'; ctx.lineWidth=7;
  ctx.beginPath();
  for(let i=0;i<=8;i++){
    const a=(i/8)*Math.PI*2 + Math.PI/8;
    const x=cx+Math.cos(a)*radius, y=cy+Math.sin(a)*radius;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.strokeStyle='#999'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,radius*0.3,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#777'; ctx.font='bold 40px Arial'; ctx.textAlign='center';
  ctx.fillText('OCTAGON', cx, cy+14);

  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

function makeChainLinkTexture(){
  const size=256;
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.lineWidth=2;
  const step=18;
  for(let x=-size;x<size*2;x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+size,size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,size); ctx.lineTo(x+size,0); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4,2);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

/* ---------------- ARENA ---------------- */
function buildArena(){
  const hemi = new THREE.HemisphereLight(0x8899ff, 0x111111, 0.6);
  scene.add(hemi);

  const spot = new THREE.SpotLight(0xffffff, 1.2, 40, Math.PI/4.2, 0.4, 1.2);
  spot.position.set(0, 14, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(512,512);
  scene.add(spot);
  scene.add(spot.target);

  const rim1 = new THREE.PointLight(0xff5533, 0.6, 20);
  rim1.position.set(-8, 5, -6);
  scene.add(rim1);
  const rim2 = new THREE.PointLight(0x3388ff, 0.6, 20);
  rim2.position.set(8, 5, -6);
  scene.add(rim2);

  const rigBar = new THREE.Mesh(new THREE.BoxGeometry(6.5,0.15,0.15), new THREE.MeshBasicMaterial({color:0x111111}));
  rigBar.position.set(0,7.6,0);
  scene.add(rigBar);
  for(let i=-2;i<=2;i++){
    const fixture = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshBasicMaterial({color:0xffffff}));
    fixture.position.set(i*1.4,7.5,0);
    scene.add(fixture);
    const fLight = new THREE.PointLight(0xffffff, 0.35, 10);
    fLight.position.copy(fixture.position);
    scene.add(fLight);
  }

  const floorGeo = new THREE.CircleGeometry(ARENA_R, 8);
  const floorMat = new THREE.MeshStandardMaterial({map: makeFloorTexture(), roughness:0.9});
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  const postMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, metalness:0.5, roughness:0.5});
  const chainTex = makeChainLinkTexture();
  const fenceMat = new THREE.MeshStandardMaterial({color:0x333333, map:chainTex, transparent:true, opacity:0.6, side:THREE.DoubleSide});
  const postH = 1.85;
  const posts = [];
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2 + Math.PI/8;
    const x = Math.cos(a)*ARENA_R, z = Math.sin(a)*ARENA_R;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,postH,6), postMat);
    post.position.set(x, postH/2, z);
    scene.add(post);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.09,6,6), postMat);
    cap.position.set(x, postH, z);
    scene.add(cap);
    posts.push(new THREE.Vector3(x,0,z));
  }
  for(let i=0;i<8;i++){
    const p1 = posts[i], p2 = posts[(i+1)%8];
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const dist = p1.distanceTo(p2);
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(dist, postH), fenceMat);
    panel.position.set(mid.x, postH/2, mid.z);
    panel.lookAt(new THREE.Vector3(0, postH/2, 0));
    scene.add(panel);
  }
  const railPts = [];
  for(let i=0;i<=8;i++){
    const a = (i/8)*Math.PI*2 + Math.PI/8;
    railPts.push(new THREE.Vector3(Math.cos(a)*ARENA_R, postH, Math.sin(a)*ARENA_R));
  }
  const railGeo = new THREE.BufferGeometry().setFromPoints(railPts);
  scene.add(new THREE.Line(railGeo, new THREE.LineBasicMaterial({color:0x444444})));

  const back = new THREE.Mesh(
    new THREE.CylinderGeometry(20,20,12,16,1,true),
    new THREE.MeshStandardMaterial({color:0x0d0d12, side:THREE.BackSide})
  );
  back.position.y = 5;
  scene.add(back);
}

/* ---------------- CROWD ---------------- */
function buildCrowd(){
  const dummy = new THREE.Object3D();
  const shirtColors = [0x8b1e1e,0x1e3a8b,0x333333,0x2f5d34,0x5b2f7a,0x1a1a1a,0x9a6a2f,0x6b6f76];
  const skinColors = [0xd8a878,0xa9744f,0x7a4a2f,0xe0b98f];
  const bodyGeo = new THREE.BoxGeometry(0.34,0.55,0.28);
  const headGeo = new THREE.SphereGeometry(0.15,5,5);

  const tiers = [
    {radius: ARENA_R+2.0, y:0.9, count:32},
    {radius: ARENA_R+3.1, y:2.0, count:36},
    {radius: ARENA_R+4.2, y:3.15, count:40},
    {radius: ARENA_R+5.3, y:4.3, count:44},
  ];

  tiers.forEach(t=>{
    const riser = new THREE.Mesh(
      new THREE.CylinderGeometry(t.radius+0.7, t.radius+0.7, 0.12, 16, 1, true),
      new THREE.MeshStandardMaterial({color:0x14141a, side:THREE.DoubleSide})
    );
    riser.position.y = t.y - 0.35;
    scene.add(riser);
  });

  const seats = [];
  tiers.forEach((tier,ti)=>{
    for(let i=0;i<tier.count;i++){
      const a = (i/tier.count)*Math.PI*2 + ti*0.15;
      const x = Math.cos(a)*tier.radius;
      const z = Math.sin(a)*tier.radius;
      const y = tier.y + Math.random()*0.12;
      seats.push({x,y,z});
    }
  });

  const bodyBuckets = shirtColors.map(()=>[]);
  const headBuckets = skinColors.map(()=>[]);
  seats.forEach((s, idx)=>{
    bodyBuckets[idx % shirtColors.length].push(s);
    headBuckets[idx % skinColors.length].push(s);
  });

  shirtColors.forEach((color, ci)=>{
    const list = bodyBuckets[ci];
    if(!list.length) return;
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.9});
    const mesh = new THREE.InstancedMesh(bodyGeo, mat, list.length);
    list.forEach((s, i)=>{
      dummy.position.set(s.x, s.y, s.z);
      dummy.lookAt(0, s.y, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  });

  skinColors.forEach((color, ci)=>{
    const list = headBuckets[ci];
    if(!list.length) return;
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.7});
    const mesh = new THREE.InstancedMesh(headGeo, mat, list.length);
    list.forEach((s,i)=>{
      dummy.position.set(s.x, s.y+0.42, s.z);
      dummy.lookAt(0, s.y+0.42, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  });
}

/* ---------------- FIGHTER (segmented limbs: shoulder->elbow, hip->knee) ---------------- */
const UPPER_ARM=0.27, FOREARM=0.28, UPPER_LEG=0.46, LOWER_LEG=0.44;
const TORSO_H=0.7, HEAD_R=0.22;
const HIP_Y = UPPER_LEG+LOWER_LEG;
const SHOULDER_Y = HIP_Y+TORSO_H-0.05;

function limbGeo(len, r1, r2){
  const geo = new THREE.CylinderGeometry(r1,r2,len,6);
  geo.translate(0,-len/2,0);
  return geo;
}

function createFighter(skinColor, shortsColor, isPlayer){
  const group = new THREE.Group();
  const skinMat = new THREE.MeshToonMaterial({color:skinColor, gradientMap:TOON_GRADIENT});
  const shortsMat = new THREE.MeshToonMaterial({color:shortsColor, gradientMap:TOON_GRADIENT});
  const gloveMat = new THREE.MeshToonMaterial({color:0x111111, gradientMap:TOON_GRADIENT});

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62,TORSO_H,0.34), skinMat);
  torso.position.set(0, HIP_Y+TORSO_H/2, 0);
  torso.castShadow = true;
  group.add(torso);

  const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.64,0.22,0.36), shortsMat);
  shorts.position.set(0, HIP_Y-0.05, 0);
  group.add(shorts);

  const head = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R,8,6), skinMat);
  head.position.set(0, HIP_Y+TORSO_H+HEAD_R+0.02, 0);
  head.castShadow = true;
  group.add(head);

  function buildArm(sideSign){
    const shoulder = new THREE.Group();
    shoulder.position.set(sideSign*0.38, SHOULDER_Y, 0.02);
    const upperArm = new THREE.Mesh(limbGeo(UPPER_ARM,0.075,0.065), skinMat);
    upperArm.castShadow = true;
    shoulder.add(upperArm);

    const elbow = new THREE.Group();
    elbow.position.set(0,-UPPER_ARM,0);
    shoulder.add(elbow);

    const forearm = new THREE.Mesh(limbGeo(FOREARM,0.065,0.055), skinMat);
    forearm.castShadow = true;
    elbow.add(forearm);

    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6), gloveMat);
    glove.position.set(0,-FOREARM,0);
    elbow.add(glove);

    return {shoulder, elbow};
  }

  function buildLeg(sideSign){
    const hip = new THREE.Group();
    hip.position.set(sideSign*0.16, HIP_Y, 0);
    const upperLeg = new THREE.Mesh(limbGeo(UPPER_LEG,0.1,0.085), shortsMat);
    upperLeg.castShadow = true;
    hip.add(upperLeg);

    const knee = new THREE.Group();
    knee.position.set(0,-UPPER_LEG,0);
    hip.add(knee);

    const lowerLeg = new THREE.Mesh(limbGeo(LOWER_LEG,0.085,0.07), skinMat);
    lowerLeg.castShadow = true;
    knee.add(lowerLeg);

    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,0.24), gloveMat);
    foot.position.set(0,-LOWER_LEG,0.03);
    knee.add(foot);

    return {hip, knee};
  }

  const leftArmParts = buildArm(-1);
  const rightArmParts = buildArm(1);
  const leftLegParts = buildLeg(-1);
  const rightLegParts = buildLeg(1);
  group.add(leftArmParts.shoulder, rightArmParts.shoulder, leftLegParts.hip, rightLegParts.hip);

  leftArmParts.shoulder.rotation.set(-0.35,0,0.15);
  rightArmParts.shoulder.rotation.set(-0.35,0,-0.15);
  leftArmParts.elbow.rotation.x = 1.3;
  rightArmParts.elbow.rotation.x = 1.3;

  return {
    group, torso, head,
    leftShoulder: leftArmParts.shoulder, rightShoulder: rightArmParts.shoulder,
    leftElbow: leftArmParts.elbow, rightElbow: rightArmParts.elbow,
    leftHip: leftLegParts.hip, rightHip: rightLegParts.hip,
    leftKnee: leftLegParts.knee, rightKnee: rightLegParts.knee,
    isPlayer,
    hp: 100, stamina: 100,
    facing: isPlayer ? 1 : -1,
    attack: null,
    blocking: false,
    hitFlashT: 0,
    walkPhase: 0,
    speed: 3.2,
    cdAI: 0
  };
}

/* ---------------- REFEREE ---------------- */
function createReferee(){
  const f = createFighter(0xe0b98f, 0x151515, false);
  f.torso.material = new THREE.MeshToonMaterial({color:0x1c1c1c, gradientMap:TOON_GRADIENT});
  f.head.material = new THREE.MeshToonMaterial({color:0xd8a878, gradientMap:TOON_GRADIENT});
  f.leftShoulder.rotation.set(0,0,0);
  f.rightShoulder.rotation.set(0,0,0);
  f.leftElbow.rotation.x = 0.2;
  f.rightElbow.rotation.x = 0.2;
  f.group.scale.setScalar(0.98);
  f.patrolAngle = Math.random()*Math.PI*2;
  return f;
}

function updateReferee(dt){
  const dist = distanceBetween();
  const targetRadius = dist < 1.5 ? 2.4 : 3.6;
  referee.patrolAngle += dt * 0.18;
  const mid = new THREE.Vector3().addVectors(player.group.position, cpu.group.position).multiplyScalar(0.5);
  const targetX = mid.x + Math.cos(referee.patrolAngle) * targetRadius;
  const targetZ = mid.z + Math.sin(referee.patrolAngle) * targetRadius;
  referee.group.position.x += (targetX - referee.group.position.x) * dt * 1.2;
  referee.group.position.z += (targetZ - referee.group.position.z) * dt * 1.2;

  const lookDir = new THREE.Vector3().subVectors(mid, referee.group.position);
  referee.group.rotation.y = Math.atan2(lookDir.x, lookDir.z);

  referee.walkPhase += dt*5;
  const phaseL = referee.walkPhase, phaseR = referee.walkPhase+Math.PI;
  referee.leftHip.rotation.x = Math.sin(phaseL)*0.4;
  referee.rightHip.rotation.x = Math.sin(phaseR)*0.4;
  referee.leftKnee.rotation.x = 0.1 + Math.max(0, Math.sin(phaseL-0.5))*0.8;
  referee.rightKnee.rotation.x = 0.1 + Math.max(0, Math.sin(phaseR-0.5))*0.8;
  referee.group.position.y = Math.sin(performance.now()*0.003)*0.015;
}

/* ---------------- COMBAT HELPERS ---------------- */
function startAttack(f, type){
  if (f.attack || f.stamina < 12) return;
  f.attack = { type, t0: performance.now(), dur: type==='punch'?260:420, hit:false };
  f.stamina = Math.max(0, f.stamina - (type==='punch'?10:16));
}

function distanceBetween(){
  return player.group.position.distanceTo(cpu.group.position);
}

function applyDamage(target, amount, from){
  if (target.blocking) amount *= 0.25;
  target.hp = Math.max(0, target.hp - amount);
  target.hitFlashT = 0.18;
  const dir = new THREE.Vector3().subVectors(target.group.position, from.group.position).normalize();
  target.group.position.addScaledVector(dir, 0.15);
  showMsg(amount>=14 ? 'ТОЧНЫЙ УДАР!' : (target.blocking ? 'БЛОК' : 'УДАР'));
  updateHUD();
  if (target.hp<=0) endFight(from);
}

let msgTimeout;
function showMsg(text){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(()=>el.classList.remove('show'), 500);
}

function updateHUD(){
  document.getElementById('hpP1').style.width = player.hp+'%';
  document.getElementById('hpP2').style.width = cpu.hp+'%';
  document.getElementById('stP1').style.width = player.stamina+'%';
  document.getElementById('stP2').style.width = cpu.stamina+'%';
}

function endFight(winner){
  if (gameOver) return;
  gameOver = true;
  document.getElementById('endSub').textContent = winner===player ? 'Красный угол побеждает' : 'Синий угол побеждает';
  document.getElementById('overlayEnd').style.display = 'flex';
}

/* ---------------- ANIMATION LOOP ---------------- */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (started && !gameOver){
    updateTimer(dt);
    handlePlayerInput(dt);
    updateAI(dt);
    physicsAndFacing(dt);
    updateAttackAnim(player, dt);
    updateAttackAnim(cpu, dt);
    regenStamina(player, dt);
    regenStamina(cpu, dt);
  }
  updateReferee(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}

function updateTimer(dt){
  roundTime -= dt;
  if (roundTime <= 0){
    roundTime = 0;
    endFight(player.hp>=cpu.hp ? player : cpu);
  }
  document.getElementById('clock').textContent = Math.ceil(roundTime);
}

function regenStamina(f, dt){
  f.stamina = Math.min(100, f.stamina + dt*8);
}

function handlePlayerInput(dt){
  const toOpp = new THREE.Vector3().subVectors(cpu.group.position, player.group.position);
  toOpp.y = 0; toOpp.normalize();
  const side = new THREE.Vector3(-toOpp.z, 0, toOpp.x);

  let move = new THREE.Vector3();
  if (KEYS['KeyW']) move.add(toOpp);
  if (KEYS['KeyS']) move.sub(toOpp);
  if (KEYS['KeyD']) move.add(side);
  if (KEYS['KeyA']) move.sub(side);

  player.blocking = !!KEYS['KeyL'];

  if (move.lengthSq() > 0){
    move.normalize();
    player.group.position.addScaledVector(move, player.speed*dt);
    player.walkPhase += dt*8;
  } else {
    player.walkPhase *= 0.9;
  }

  const R = 5.6;
  const p = player.group.position;
  const d = Math.sqrt(p.x*p.x+p.z*p.z);
  if (d>R){ p.x *= R/d; p.z *= R/d; }

  if (KEYS['KeyJ']) startAttack(player, 'punch');
  if (KEYS['KeyK']) startAttack(player, 'kick');
}

function updateAI(dt){
  cpu.cdAI -= dt;
  const toPlayer = new THREE.Vector3().subVectors(player.group.position, cpu.group.position);
  toPlayer.y = 0;
  const d = toPlayer.length();
  toPlayer.normalize();

  cpu.blocking = false;

  if (d > 1.55){
    cpu.group.position.addScaledVector(toPlayer, cpu.speed*0.9*dt);
    cpu.walkPhase += dt*8;
  } else {
    cpu.walkPhase *= 0.9;
    if (cpu.cdAI <= 0){
      const roll = Math.random();
      if (roll < 0.45) startAttack(cpu, 'punch');
      else if (roll < 0.75) startAttack(cpu, 'kick');
      else cpu.blocking = true;
      cpu.cdAI = 0.7 + Math.random()*0.9;
    }
  }

  if (cpu.hp < 30 && Math.random()<0.01){
    cpu.group.position.addScaledVector(toPlayer, -cpu.speed*dt*2);
  }

  const R = 5.6;
  const p = cpu.group.position;
  const dd = Math.sqrt(p.x*p.x+p.z*p.z);
  if (dd>R){ p.x *= R/dd; p.z *= R/dd; }
}

function physicsAndFacing(dt){
  [player, cpu].forEach((f, i)=>{
    const opp = i===0 ? cpu : player;
    const dir = new THREE.Vector3().subVectors(opp.group.position, f.group.position);
    const angle = Math.atan2(dir.x, dir.z);
    f.group.rotation.y = angle;

    const bob = Math.sin(performance.now()*0.004 + (i*3.14)) * 0.02;
    f.group.position.y = bob;

    const phaseL = f.walkPhase, phaseR = f.walkPhase+Math.PI;
    f.leftHip.rotation.x = Math.sin(phaseL)*0.55;
    f.rightHip.rotation.x = Math.sin(phaseR)*0.55;
    f.leftKnee.rotation.x = 0.15 + Math.max(0, Math.sin(phaseL-0.5))*1.0;
    f.rightKnee.rotation.x = 0.15 + Math.max(0, Math.sin(phaseR-0.5))*1.0;

    if (!f.attack){
      f.leftShoulder.rotation.x += (-0.35 - f.leftShoulder.rotation.x)*0.15;
      f.rightShoulder.rotation.x += (-0.35 - f.rightShoulder.rotation.x)*0.15;
      f.leftElbow.rotation.x += (1.3 - f.leftElbow.rotation.x)*0.15;
      f.rightElbow.rotation.x += (1.3 - f.rightElbow.rotation.x)*0.15;
    }
    if (f.blocking){
      f.leftShoulder.rotation.x += (-0.9 - f.leftShoulder.rotation.x)*0.3;
      f.rightShoulder.rotation.x += (-0.9 - f.rightShoulder.rotation.x)*0.3;
      f.leftElbow.rotation.x += (1.6 - f.leftElbow.rotation.x)*0.3;
      f.rightElbow.rotation.x += (1.6 - f.rightElbow.rotation.x)*0.3;
    }

    if (f.hitFlashT > 0){
      f.hitFlashT -= dt;
      const glow = Math.max(0, f.hitFlashT/0.18);
      f.torso.material.emissive = new THREE.Color(1,0,0).multiplyScalar(glow*0.6);
    } else {
      f.torso.material.emissive = new THREE.Color(0,0,0);
    }
  });

  const minDist = 0.9;
  const delta = new THREE.Vector3().subVectors(cpu.group.position, player.group.position);
  const dist = delta.length();
  if (dist < minDist && dist>0.0001){
    const push = delta.normalize().multiplyScalar((minDist-dist)/2);
    player.group.position.sub(push);
    cpu.group.position.add(push);
  }
}

function updateAttackAnim(f, dt){
  if (!f.attack) return;
  const t = (performance.now() - f.attack.t0) / f.attack.dur;
  if (t >= 1){
    f.attack = null;
    return;
  }
  const swing = Math.sin(t*Math.PI);

  if (f.attack.type === 'punch'){
    f.rightShoulder.rotation.x = -0.35 - swing*1.6;
    f.rightShoulder.rotation.z = -0.15 + swing*0.2;
    f.rightElbow.rotation.x = 1.3*(1-swing) + 0.05*swing;
  } else {
    f.rightHip.rotation.x = -0.3 - swing*0.9;
    f.rightHip.rotation.z = -swing*1.0 * f.facing * -1;
    f.rightKnee.rotation.x = (1-swing)*1.3;
  }

  if (!f.attack.hit && t > 0.45 && t < 0.65){
    const dist = distanceBetween();
    const reach = f.attack.type==='punch' ? 1.55 : 1.85;
    if (dist < reach){
      f.attack.hit = true;
      const target = f===player ? cpu : player;
      const dmg = f.attack.type==='punch' ? (6+Math.random()*6) : (10+Math.random()*8);
      applyDamage(target, dmg, f);
    }
  }
}

function updateCamera(dt){
  const pivot = player.group.position.clone().add(new THREE.Vector3(0,1.3,0));
  const behind = new THREE.Vector3().subVectors(player.group.position, cpu.group.position);
  behind.y = 0;
  if (behind.lengthSq() < 0.0001) behind.set(0,0,1); else behind.normalize();
  const baseYaw = Math.atan2(behind.x, behind.z);
  const yaw = baseYaw + camYaw;
  const pitch = camPitch;

  const horiz = Math.cos(pitch) * camDistance;
  const offset = new THREE.Vector3(Math.sin(yaw)*horiz, Math.sin(pitch)*camDistance + 0.4, Math.cos(yaw)*horiz);
  const desired = pivot.clone().add(offset);

  camera.position.lerp(desired, 1 - Math.pow(0.0005, dt));
  const mid = new THREE.Vector3().addVectors(player.group.position, cpu.group.position).multiplyScalar(0.5).add(new THREE.Vector3(0,1.3,0));
  camera.lookAt(mid);
}
</script>
